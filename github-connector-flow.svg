<svg role="img" width="100%" viewBox="0 0 680 464" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>GitHub 连接器使用流程</title>
  <desc>四步流程：打开连接器面板、添加 GitHub、完成 OAuth 授权、在任务中使用并验证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g>
    <rect x="190" y="40" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">1. 打开连接器面板</text>
    <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">侧边栏「专家·技能·连接器」→ 连接器</text>
  </g>
  <line x1="340" y1="96" x2="340" y2="156" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="190" y="156" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">2. 添加 GitHub 连接器</text>
    <text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">找到 GitHub 卡片 → 点击「+」→「连接」</text>
  </g>
  <line x1="340" y1="212" x2="340" y2="272" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="190" y="272" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">3. 完成 OAuth 授权</text>
    <text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">浏览器登录 GitHub → 点 Authorize</text>
  </g>
  <line x1="340" y1="328" x2="340" y2="388" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="190" y="388" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">4. 在任务中启用并验证</text>
    <text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">输入框「+」→ 连接器 → 开启 GitHub</text>
  </g>
</svg>
